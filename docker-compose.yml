# Scanner OCR API — rodar local com Docker
# Uso: docker compose up --build
# API em http://localhost:8000  |  Docs: http://localhost:8000/docs

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    # Ajuste se precisar de mais memória para o OCR (ex.: 2G)
